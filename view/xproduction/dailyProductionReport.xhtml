<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['DailyProductionReport.title']}</ui:define>
    <ui:param name="bodyAlign" value="center"/>
    <ui:param name="bodyWidth" value="60%"/>
    <ui:param name="selectedTab" value="xproduction"/>

    <ui:define name="body">
        <h:form id="dailyProductionReportForm">

            <rich:panel>
                <f:facet name="header">
                    #{messages['DailyProductionReport.title']}
                </f:facet>

                <s:decorate id="lineField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['DailyProductionReport.line']}</ui:define>
                    <h:selectOneMenu id="line"
                                     value="#{dailyProductionReportAction.productionLine}"
                                     styleClass="input250"
                                     required="true"
                                     tabindex="1">
                        <s:selectItems value="#{productionLineList}"
                                       var="pl"
                                       label="#{pl.name}"
                                       noSelectionLabel=""
                                       hideNoSelectionLabel="false"/>
                        <s:convertEntity/>
                    </h:selectOneMenu>
                </s:decorate>

                <s:decorate id="yearField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['DailyProductionReport.year']}</ui:define>
                    <h:inputText id="year" value="#{dailyProductionReportAction.year}"
                                 styleClass="inputSmall right" required="true" maxlength="4" tabindex="2"/>
                </s:decorate>

                <s:decorate id="monthField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['DailyProductionReport.month']}</ui:define>
                    <h:selectOneMenu id="month"
                                     value="#{dailyProductionReportAction.month}"
                                     styleClass="inputSmall"
                                     required="true"
                                     tabindex="3">
                        <f:selectItem itemLabel="Enero"      itemValue="1"/>
                        <f:selectItem itemLabel="Febrero"    itemValue="2"/>
                        <f:selectItem itemLabel="Marzo"      itemValue="3"/>
                        <f:selectItem itemLabel="Abril"      itemValue="4"/>
                        <f:selectItem itemLabel="Mayo"       itemValue="5"/>
                        <f:selectItem itemLabel="Junio"      itemValue="6"/>
                        <f:selectItem itemLabel="Julio"      itemValue="7"/>
                        <f:selectItem itemLabel="Agosto"     itemValue="8"/>
                        <f:selectItem itemLabel="Septiembre" itemValue="9"/>
                        <f:selectItem itemLabel="Octubre"    itemValue="10"/>
                        <f:selectItem itemLabel="Noviembre"  itemValue="11"/>
                        <f:selectItem itemLabel="Diciembre"  itemValue="12"/>
                    </h:selectOneMenu>
                </s:decorate>

            </rich:panel>

            <div class="buttons">
                <h:commandButton action="#{dailyProductionReportAction.generateReport}"
                                 styleClass="button"
                                 value="#{messages['Common.generate']}"
                                 id="generateButtonId"
                                 tabindex="5">
                    <s:defaultAction/>
                </h:commandButton>
            </div>

        </h:form>
    </ui:define>
</ui:composition>
