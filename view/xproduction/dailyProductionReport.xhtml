<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:rich="http://richfaces.org/rich" xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['Reports.production.dailyProductionReport']}</ui:define>
    <ui:param name="bodyAlign" value="center"/>
    <ui:param name="bodyWidth" value="70%"/>

    <ui:param name="selectedTab" value="products"/>
    <ui:define name="body">
        <h:form id="estimationStockReportForm">

            <rich:panel>
                <f:facet name="header">
                    #{messages['Reports.production.dailyProductionReport']}
                </f:facet>

                <s:decorate id="startDateField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Common.initDate']}</ui:define>
                    <rich:calendar id="startDate"
                                   value="#{productionInputsReportAction.startDate}"
                                   datePattern="#{messages['patterns.date']}"
                                   enableManualInput="true"
                                   required="true"
                                   tabindex="1">
                        <f:convertDateTime pattern="#{messages['patterns.date']}"
                                           timeZone="#{sessionUser.timeZone}"
                                           type="date"/>
                    </rich:calendar>
                </s:decorate>

                <s:decorate id="endDateField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Common.endDate']}</ui:define>
                    <rich:calendar id="endDate"
                                   value="#{productionInputsReportAction.endDate}"
                                   datePattern="#{messages['patterns.date']}"
                                   enableManualInput="true"
                                   required="true"
                                   tabindex="2">
                        <f:convertDateTime pattern="#{messages['patterns.date']}"
                                           timeZone="#{sessionUser.timeZone}"
                                           type="date"/>
                    </rich:calendar>
                </s:decorate>

            </rich:panel>

            <app:reportDefaultOptions reportAction="#{rawMilkReportAction}" showPageFormat="false"
                                      tabIndex="3"
                                      showReportTitle="false"/>

            <div class="buttons">
                <h:commandButton action="#{productionInputsReportAction.generateReport}"
                                 styleClass="button"
                                 value="#{messages['Common.generate']}" id="generateButtonId" tabindex="4">
                    <s:defaultAction/>
                </h:commandButton>
            </div>

        </h:form>

    </ui:define>
</ui:composition>
