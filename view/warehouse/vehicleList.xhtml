<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">
    <ui:define name="pageTitle">#{messages['Vehicle.titlePlural']}</ui:define>
    <ui:param name="bodyWidth" value="80%"/>
    <ui:param name="selectedTab" value="warehouses"/>
    <ui:define name="body">
        <h:form id="vehicleSearch">

            <rich:simpleTogglePanel label="#{messages['Common.search']}" switchType="client">
                <s:decorate id="plateFilter" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Vehicle.plate']}</ui:define>
                    <h:inputText id="plate" value="#{vehicleDataModel.criteria.plate}"
                                 maxlength="20" tabindex="1" styleClass="input"/>
                </s:decorate>

                <s:decorate id="brandFilter" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Vehicle.brand']}</ui:define>
                    <h:inputText id="brand" value="#{vehicleDataModel.criteria.brand}"
                                 maxlength="50" tabindex="2" styleClass="input"/>
                </s:decorate>

                <s:decorate id="stateFilter" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Vehicle.state']}</ui:define>
                    <h:selectOneMenu id="state" value="#{vehicleDataModel.state}"
                                     styleClass="input" tabindex="3">
                        <s:selectItems value="#{vehicleStateList}" var="st"
                                       label="#{messages[st.resourceKey]}"
                                       noSelectionLabel=""
                                       hideNoSelectionLabel="false"/>
                        <s:convertEnum/>
                    </h:selectOneMenu>
                </s:decorate>

                <div class="buttons">
                    <a4j:commandButton action="#{vehicleDataModel.search}"
                                       reRender="vehicleList, dataScroller"
                                       styleClass="button"
                                       value="#{messages['Common.search']}" id="searchButtonId" tabindex="4">
                        <s:defaultAction/>
                    </a4j:commandButton>
                </div>

                <rich:jQuery selector="#plate" query="focus()" timing="onload"/>
            </rich:simpleTogglePanel>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}" view="/warehouse/vehicle.xhtml"
                          styleClass="button" propagation="begin"
                          rendered="#{s:hasPermission('WAREHOUSEVEHICLE','CREATE')}"/>
            </div>

            <rich:dataTable value="#{vehicleDataModel}" var="vehicleItem" id="vehicleList"
                            rows="#{sessionUser.rowsPerPage15}"
                            width="100%" columnsWidth="25%, 30%, 20%, 15%, 10%">
                <f:facet name="header">
                    <rich:columnGroup>
                        <rich:column>
                            <app:commandSortHeader sortProperty="vehicle.plate"
                                                   dataModel="#{vehicleDataModel}"
                                                   reRender="vehicleList, dataScroller">
                                #{messages['Vehicle.plate']}
                            </app:commandSortHeader>
                        </rich:column>
                        <rich:column>#{messages['Vehicle.brand']}</rich:column>
                        <rich:column>#{messages['Vehicle.color']}</rich:column>
                        <rich:column>#{messages['Vehicle.state']}</rich:column>
                        <rich:column styleClass="center">#{messages['Common.action']}</rich:column>
                    </rich:columnGroup>
                </f:facet>
                <rich:column>
                    <h:outputText value="#{vehicleItem.plate}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{vehicleItem.brand}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{vehicleItem.color}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{messages[vehicleItem.state.resourceKey]}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:commandLink value="#{messages['Common.select']}"
                                   immediate="true"
                                   rendered="#{s:hasPermission('WAREHOUSEVEHICLE','VIEW')}"
                                   action="#{vehicleAction.select(vehicleItem)}">
                        <s:conversationPropagation value="begin"/>
                    </h:commandLink>
                </rich:column>
            </rich:dataTable>
            <app:dataScroller id="dataScroller" for="vehicleList" dataModel="#{vehicleDataModel}"/>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}" view="/warehouse/vehicle.xhtml"
                          styleClass="button" propagation="begin"
                          rendered="#{s:hasPermission('WAREHOUSEVEHICLE','CREATE')}"/>
            </div>

        </h:form>
    </ui:define>
</ui:composition>
