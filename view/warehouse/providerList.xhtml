<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['Provider.list']}</ui:define>
    <ui:param name="bodyWidth" value="100%"/>
    <ui:param name="bodyAlign" value="center"/>

    <ui:param name="selectedTab" value="warehouses"/>
    <ui:define name="body">
        <h:form id="providerSearch">
            <!-- Barra de filtros reusable (app-filterbar): una sola linea, placeholders estilo Odoo.
                 Se conservan los filtros actuales: Codigo y Nombre. El boton Nuevo va en la misma
                 linea, al extremo derecho. -->
            <div class="app-filterbar">
                <h:inputText id="providerCode"
                             value="#{providerDataModel.criteria.providerCode}"
                             styleClass="app-filterbar__input app-filterbar__input--code app-ph-code"
                             maxlength="6"
                             tabindex="1"/>

                <h:inputText id="nit"
                             value="#{providerDataModel.nit}"
                             styleClass="app-filterbar__input app-filterbar__input--code app-ph-nit"
                             maxlength="20"
                             tabindex="2"/>

                <h:inputText id="acronym"
                             value="#{providerDataModel.acronym}"
                             styleClass="app-filterbar__input app-ph-name"
                             maxlength="150"
                             tabindex="3"/>

                <h:selectOneMenu id="state"
                                 value="#{providerDataModel.financesEntityState}"
                                 styleClass="app-filterbar__select"
                                 tabindex="4">
                    <s:selectItems value="#{financesEntityStateEnumList}"
                                   var="financesEntityState"
                                   label="#{messages[financesEntityState.resourceKey]}"
                                   noSelectionLabel="#{messages['FinanceProvider.entity.state']}"
                                   hideNoSelectionLabel="false"/>
                    <s:convertEnum/>
                </h:selectOneMenu>

                <a4j:commandLink action="#{providerDataModel.search}"
                                 reRender="providerList, dataScroller"
                                 styleClass="app-iconbtn"
                                 title="#{messages['Common.search']}"
                                 id="searchButtonId"
                                 tabindex="5">
                    <h:graphicImage value="/img/search-line.svg" alt="#{messages['Common.search']}"/>
                    <s:defaultAction/>
                </a4j:commandLink>

                <s:button value="#{messages['Common.new']}"
                          view="/warehouse/provider.xhtml"
                          styleClass="app-btn-primary"
                          rendered="#{s:hasPermission('WAREHOUSEPROVIDERMAN','CREATE')}"
                          propagation="begin"/>
            </div>

            <!-- Placeholders (JSF 1.2 no propaga el atributo placeholder): se aplican por clase
                 marcador. El texto proviene de las claves i18n, no esta hardcodeado. -->
            <script type="text/javascript">
                (function () {
                    function ph(sel, t) {
                        var e = document.querySelector(sel);
                        if (e) { e.setAttribute("placeholder", t); }
                    }
                    ph(".app-ph-code", "#{messages['Provider.providerCode']}");
                    ph(".app-ph-nit", "#{messages['Provider.nitNumber']}");
                    ph(".app-ph-name", "#{messages['Provider.name']}");
                })();
            </script>

            <!-- Separacion sutil (linea en blanco 5px) entre filtros y tabla, solo en esta vista. -->
            <div style="height: 5px;"></div>

            <rich:dataTable value="#{providerDataModel}"
                            var="providerItem"
                            id="providerList"
                            rows="#{providerDataModel.pageSize}"
                            width="100%"
                            columnsWidth="">

                <f:facet name="header">
                    <rich:columnGroup>
                        <rich:column>
                            <app:commandSortHeader sortProperty="provider.providerCode"
                                                   dataModel="#{providerDataModel}"
                                                   reRender="providerList, dataScroller">
                                #{messages['Provider.providerCode']}
                            </app:commandSortHeader>
                        </rich:column>
                        <rich:column>
                            #{messages['Provider.nitNumber']}
                        </rich:column>
                        <rich:column>
                            <app:commandSortHeader sortProperty="provider.entity"
                                                   dataModel="#{providerDataModel}"
                                                   reRender="providerList, dataScroller">
                                #{messages['Provider.name']}
                            </app:commandSortHeader>
                        </rich:column>
                        <rich:column styleClass="center">
                                #{messages['Provider.cashAccount']}
                        </rich:column>
                        <rich:column styleClass="center">
                            #{messages['FinanceProvider.entity.state']}
                        </rich:column>
                        <rich:column styleClass="center">
                            #{messages['Common.action']}
                        </rich:column>
                    </rich:columnGroup>
                </f:facet>

                <rich:column>
                    <h:outputText value="#{providerItem.providerCode}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{providerItem.entity.nitNumber}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{providerItem.entity.acronym}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{providerItem.payableAccountCode}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:outputText value="#{messages[providerItem.entity.state.resourceKey]}"/>
                </rich:column>

                <rich:column styleClass="center">
                    <h:commandLink immediate="true"
                                   action="#{providerAction.select(providerItem)}"
                                   rendered="#{s:hasPermission('WAREHOUSEPROVIDERMAN','VIEW')}">
                        <h:graphicImage value="/img/edit-line.svg" styleClass="select-image" title="#{messages['Common.edit']}"/>
                        <s:conversationPropagation value="none"/>
                    </h:commandLink>
                </rich:column>
            </rich:dataTable>

            <app:dataScroller id="dataScroller" for="providerList" dataModel="#{providerDataModel}" showPageSize="true"/>

            <rich:jQuery selector="#providerCode" query="focus()" timing="onload"/>
        </h:form>
    </ui:define>

</ui:composition>
