<rich:modalPanel width="560" zindex="2000" resizeable="false" autosized="true"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:rich="http://richfaces.org/rich"
                 xmlns:ui="http://java.sun.com/jsf/facelets"
                 xmlns:h="http://java.sun.com/jsf/html"
                 xmlns:f="http://java.sun.com/jsf/core"
                 xmlns:a4j="http://richfaces.org/a4j"
                 xmlns:s="http://jboss.com/products/seam/taglib"
                 id="#{dialogId}">

    <f:facet name="header">
        <h:outputText value="#{messages['VacationAccrual.title']}"/>
    </f:facet>
    <f:facet name="controls">
        <h:graphicImage value="/img/close.png" style="cursor:pointer" id="closeAccrualLink"/>
    </f:facet>

    <h:form id="vacationAccrualForm">
        <h:panelGrid columns="1" width="100%" cellpadding="0" cellspacing="0" border="0">
            <h:outputText styleClass="formNote" value="#{messages['VacationAccrual.hint']}"/>
        </h:panelGrid>

        <a4j:outputPanel id="accrualProgress" layout="block">

            <!-- Corriendo: barra propia, sin animacion. Se llena y se queda quieta, asi que
                 nunca puede dar la impresion de seguir trabajando cuando ya termino. -->
            <s:div rendered="#{vacationAccrualAction.running}">
                <span class="app-progress">
                    <span class="app-progress__fill"
                          style="width: #{vacationAccrualAction.progress}%;">&#160;</span>
                </span>
                <h:outputFormat styleClass="app-progress__label"
                                value="#{messages['VacationAccrual.processing']}">
                    <f:param value="#{vacationAccrualAction.done}"/>
                    <f:param value="#{vacationAccrualAction.total}"/>
                </h:outputFormat>
            </s:div>

            <!-- Terminado: se dice que termino, y recien despues los numeros. -->
            <s:div rendered="#{vacationAccrualAction.finished}">
                <h:outputText styleClass="app-tag"
                              value="#{vacationAccrualAction.total == 0
                                       ? messages['VacationAccrual.nothingToDo']
                                       : messages['VacationAccrual.finished']}"/>

                <h:panelGrid columns="2" cellpadding="3" cellspacing="0" border="0"
                             rendered="#{vacationAccrualAction.total > 0}">
                    <h:outputText value="#{messages['VacationAccrual.reviewed']}"/>
                    <h:outputText value="#{vacationAccrualAction.total}"/>

                    <h:outputText value="#{messages['VacationAccrual.updated']}"/>
                    <h:outputText value="#{vacationAccrualAction.updated}" styleClass="app-tag"/>

                    <h:outputText value="#{messages['VacationAccrual.failures']}"/>
                    <h:outputText value="#{vacationAccrualAction.failureCount}"
                                  styleClass="#{vacationAccrualAction.failureCount > 0 ? 'app-tag app-tag--warn' : ''}"/>
                </h:panelGrid>

                <h:panelGrid columns="2" cellpadding="3" cellspacing="0" border="0"
                             rendered="#{vacationAccrualAction.employeesWithoutPlanning > 0}">
                    <h:outputText value="#{messages['VacationAccrual.withoutPlanning']}"/>
                    <h:outputText value="#{vacationAccrualAction.employeesWithoutPlanning}"
                                  styleClass="app-tag app-tag--warn"/>
                </h:panelGrid>

                <rich:dataTable id="accrualFailures"
                                value="#{vacationAccrualAction.failures}"
                                var="failureItem"
                                width="100%"
                                rendered="#{not empty vacationAccrualAction.failures}">
                    <f:facet name="header">#{messages['VacationAccrual.failuresDetail']}</f:facet>
                    <rich:column>
                        <h:outputText value="#{failureItem}"/>
                    </rich:column>
                </rich:dataTable>
            </s:div>

            <a4j:poll id="accrualPoll"
                      interval="300"
                      enabled="#{vacationAccrualAction.running}"
                      action="#{vacationAccrualAction.step}"
                      reRender="accrualProgress, accrualButtons"/>
        </a4j:outputPanel>

        <div class="buttonsRight">
            <a4j:outputPanel id="accrualButtons" layout="inline">
                <a4j:commandButton action="#{vacationAccrualAction.start}"
                                   value="#{messages['VacationAccrual.start']}"
                                   styleClass="button"
                                   rendered="#{not vacationAccrualAction.running and not vacationAccrualAction.finished}"
                                   reRender="accrualProgress, accrualButtons"/>
                <a4j:commandButton action="#{vacationAccrualAction.clear}"
                                   value="#{messages['Common.close']}"
                                   styleClass="button"
                                   rendered="#{not vacationAccrualAction.running}"
                                   reRender="accrualProgress, accrualButtons, vacationPlanningList, dataScroller"
                                   oncomplete="Richfaces.hideModalPanel('#{dialogId}');"/>
            </a4j:outputPanel>
        </div>
    </h:form>

    <rich:componentControl for="#{dialogId}" attachTo="closeAccrualLink" operation="hide" event="onclick"/>

</rich:modalPanel>
