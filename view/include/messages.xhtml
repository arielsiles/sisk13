<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:s="http://jboss.com/products/seam/taglib">
    <!-- Banda reservada para mensajes globales (app-msgband): reserva el alto del gap
         actual para que un mensaje de 1 renglon NO desplace el contenido; solo crece si
         el mensaje excede. El <br/> se elimino: el espaciado se controla por CSS. -->
    <div class="app-msgband">
        <!-- id: para que una accion ajax pueda refrescar la banda (reRender=":globalMessages")
             y sus mensajes se vean sin recargar la pagina. -->
        <rich:messages id="globalMessages"
                       globalOnly="true" styleClass="message" errorClass="messageError" infoClass="messageInfo"
                       warnClass="messageWarm">
            <f:facet name="errorMarker">
                <h:graphicImage value="/img/errorIcon.gif"/>
            </f:facet>
            <f:facet name="infoMarker">
                <h:graphicImage value="/img/infoIcon.gif"/>
            </f:facet>
            <f:facet name="warnMarker">
                <h:graphicImage value="/img/warnIcon.gif"/>
            </f:facet>
        </rich:messages>
    </div>
</ui:composition>
