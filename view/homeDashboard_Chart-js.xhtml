<?xml version="1.0" encoding="UTF-8"?>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                template="layout/templateDashboard.xhtml">

    <ui:define name="pageTitle">Dashboard</ui:define>

    <ui:define name="body">

        <style>
            #chartsContainer, #chartsContainer2 {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 20px;
                padding: 20px;
            }
            .chart-wrapper {
                flex: 1 1 400px;
                max-width: 600px;
                box-sizing: border-box;
            }
            .chart-fullwidth {
                width: 100%;
                padding: 20px;
                box-sizing: border-box;
            }
            canvas {
                width: 100% !important;
                height: auto !important;
                border: 1px solid black;
            }
        </style>

        <!-- Primera fila -->
        <div id="chartsContainer">
            <div class="chart-wrapper">
                <canvas id="myChart"></canvas> <!-- Barras -->
            </div>
            <div class="chart-wrapper">
                <canvas id="myChart2"></canvas> <!-- Línea -->
            </div>
        </div>

        <!-- Segunda fila -->
        <div id="chartsContainer2">
            <div class="chart-wrapper">
                <canvas id="myChart3"></canvas> <!-- Pastel -->
            </div>
            <div class="chart-wrapper">
                <canvas id="myChart4"></canvas><!-- Dona -->
            </div>
        </div>

        <!-- Gráfico de ancho completo -->
        <div class="chart-fullwidth">
            <canvas id="myChart5"></canvas>
        </div>

        <script id="employeeData" type="application/json">#{dashboardReportAction.employeeChartData}</script>

        <script id="materiaPrimaData" type="application/json">#{dashboardReportAction.materiaPrimaChartData}</script>

        <script>
            /*window.addEventListener('load', function () {
                if (typeof Chart === 'undefined') {
                    console.error("Chart.js NO cargado.");
                    return;
                }

                console.log("Versión de Chart.js:", Chart.version);

                // Gráfico de Barras
                new Chart(document.getElementById('myChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Enero', 'Febrero', 'Marzo', 'Abril'],
                        datasets: [{
                            label: 'Ventas',
                            data: [12, 19, 3, 5],
                            backgroundColor: 'rgba(75, 192, 192, 0.5)'
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'top' },
                            tooltip: { enabled: true }
                        }
                    }
                });*/

            window.addEventListener('load', function () {
                const jsonData = document.getElementById('employeeData').textContent;
                const data = JSON.parse(jsonData);

                const labels = data.map(emp => emp.name);
                const salaries = data.map(emp => emp.salary);

                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Salario de Empleados',
                            data: salaries,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            });

            // Gráfico de Línea
            new Chart(document.getElementById('myChart2'), {
                type: 'line',
                data: {
                    labels: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio'],
                    datasets: [{
                        label: 'Usuarios',
                        data: [10, 50, 80, 120, 180, 200],
                        fill: false,
                        borderColor: 'rgba(153, 102, 255, 0.7)',
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    plugins: {
                        legend: { position: 'top' }
                    }
                }
            });

            // Gráfico de Pastel
            new Chart(document.getElementById('myChart3'), {
                type: 'pie',
                data: {
                    labels: ['Producto A', 'Producto B', 'Producto C'],
                    datasets: [{
                        label: 'Productos',
                        data: [30, 45, 25],
                        backgroundColor: [
                            'rgba(255, 99, 132, 0.6)',
                            'rgba(54, 162, 235, 0.6)',
                            'rgba(255, 206, 86, 0.6)'
                        ]
                    }]
                },
                options: {
                    responsive: true
                }
            });

            // Gráfico Dona
            window.addEventListener('load', function () {
                const jsonData = document.getElementById('materiaPrimaData').textContent;
                const data = JSON.parse(jsonData);

                console.log(jsonData);

                const labels = data.map(item => item.name);
                const pesos = data.map(item => item.peso);

                const ctx = document.getElementById('myChart4').getContext('2d');
                new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: 'Peso Tonelada',
                            data: pesos,
                            backgroundColor: [
                                'rgba(255, 99, 132, 0.5)',
                                'rgba(54, 162, 235, 0.5)',
                                'rgba(255, 206, 86, 0.5)',
                                'rgba(75, 192, 192, 0.5)',
                                'rgba(153, 102, 255, 0.5)',
                                'rgba(255, 159, 64, 0.5)'
                            ],
                            borderColor: [
                                'rgba(255, 99, 132, 1)',
                                'rgba(54, 162, 235, 1)',
                                'rgba(255, 206, 86, 1)',
                                'rgba(75, 192, 192, 1)',
                                'rgba(153, 102, 255, 1)',
                                'rgba(255, 159, 64, 1)'
                            ],
                            borderWidth: 1
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: {
                                position: 'top',
                            },
                            title: {
                                display: true,
                                text: 'Distribución de Materias Primas por Peso'
                            }
                        }
                    }
                });
            });



            // Gráfico de Barras Horizontales (myChart5) con degradado
            const ctx5 = document.getElementById('myChart5').getContext('2d');

            // Crear un degradado horizontal
            const gradient = ctx5.createLinearGradient(0, 0, ctx5.canvas.width, 0);
            gradient.addColorStop(0, 'rgba(54, 162, 235, 0.8)');
            gradient.addColorStop(1, 'rgba(153, 102, 255, 0.8)');

            new Chart(ctx5, {
                type: 'bar',
                data: {
                    labels: ['Marketing', 'Ventas', 'Desarrollo', 'Recursos Humanos', 'Finanzas', 'Soporte Técnico', 'Logística'],
                    datasets: [{
                        label: 'Presupuesto Anual (en miles)',
                        data: [120, 150, 300, 80, 200, 100, 90],
                        backgroundColor: gradient,
                        borderColor: 'rgba(54, 162, 235, 1)',
                        borderWidth: 1
                    }]
                },
                options: {
                    indexAxis: 'y',
                    responsive: true,
                    plugins: {
                        legend: { display: false },
                        title: {
                            display: true,
                            text: 'Presupuesto por Departamento'
                        }
                    },
                    scales: {
                        x: {
                            beginAtZero: true,
                            title: {
                                display: true,
                                text: 'Presupuesto (miles $)'
                            }
                        },
                        y: {
                            title: {
                                display: true,
                                text: 'Departamentos'
                            }
                        }
                    }
                }
            });
        </script>

    </ui:define>


</ui:composition>
