<!-- Dashboard de Finanzas -->
<div class="stats">
    <div class="stat-card">
        <div class="stat-value" id="totalIncome">-</div>
        <div class="stat-label">Total Ingresos</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalExpenses">-</div>
        <div class="stat-label">Total Gastos</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalBalance">-</div>
        <div class="stat-label">Balance Neto</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalAccounts">-</div>
        <div class="stat-label">Conceptos Registrados</div>
    </div>

    </div>
