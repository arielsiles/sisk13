<!-- Dashboard de Finanzas -->
<div class="stats">
    <div class="stat-card">
        <div class="stat-value" id="totalIncome">-</div>
        <div class="stat-label">Ingresos ($)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalExpenses">-</div>
        <div class="stat-label">Gastos ($)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalBalance">-</div>
        <div class="stat-label">Balance ($)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalAccounts">-</div>
        <div class="stat-label">Cuentas Activas</div>
    </div>
</div>

<div class="charts-container">
    <div class="chart-box">
        <div id="incomeChart" class="chart-container"></div>
    </div>
    
    <div class="chart-box">
        <div id="expensesChart" class="chart-container"></div>
    </div>
    
    <div class="chart-box full-width">
        <div id="cashFlowChart" class="chart-container"></div>
    </div>
</div>
