<!-- Dashboard de Producción -->

<!-- Sección 1: Cards de estadísticas -->
<div class="stats">
    <div class="stat-card">
        <div class="stat-value" id="totalProducts">-</div>
        <div class="stat-label">Productos</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalProductQuantity">-</div>
        <div class="stat-label">Cantidad Producto (Tn)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalRawMaterial">-</div>
        <div class="stat-label">Cantidad Materia Prima (Tn)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalCost">-</div>
        <div class="stat-label">Costo Total (Bs)</div>
    </div>
</div>

<!-- Sección 2: Gráfico de líneas Producción Diaria -->
<div class="charts-container">
    <div class="chart-box full-width">
        <div id="dailyProductionChart" class="chart-container"></div>
    </div>
</div>

<!-- Sección 3: Gráfico Producción vs Materia Prima -->
<div class="charts-container">
    <div class="chart-box full-width">
        <div id="productionVsRawMaterialChart" class="chart-container"></div>
    </div>
</div>
