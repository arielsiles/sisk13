<div class="controls">
    <div class="nav-tabs">
        <button class="tab-btn active" data-dashboard="production" onclick="DashboardNavigation.switchDashboard('production')">
            Producción
        </button>
        <button class="tab-btn" data-dashboard="materiaPrima" onclick="DashboardNavigation.switchDashboard('materiaPrima')">
            Materia Prima
        </button>
        <button class="tab-btn" data-dashboard="inventory" onclick="DashboardNavigation.switchDashboard('inventory')">
            Inventarios
        </button>
        <button class="tab-btn" data-dashboard="finance" onclick="DashboardNavigation.switchDashboard('finance')">
            Finanzas
        </button>
    </div>
    
    <div class="controls-right">
        <div class="control-group">
            <select id="periodSelector" onchange="DashboardCore.applyDatePeriod(this.value)">
                <option value="custom">Personalizado</option>
                <option value="current_month">Este mes</option>
                <option value="last_quarter">Último trimestre</option>
                <option value="current_year">Año actual</option>
                <option value="first_semester">Primer semestre</option>
                <option value="second_semester">Segundo semestre</option>
                <option value="last_30_days">Últimos 30 días</option>
                <option value="last_6_months">Últimos 6 meses</option>
            </select>
        </div>
        <div class="control-group">
            <input type="date" id="startDate">
        </div>
        <div class="control-group">
            <input type="date" id="endDate">
        </div>
        <button class="btn" id="filterBtn" onclick="DashboardCore.loadData()">
            Actualizar Datos
        </button>
        <button class="btn" onclick="DashboardCore.testConnection()" style="background: #28a745;">
            Test Conexión
        </button>
    </div>
</div>
