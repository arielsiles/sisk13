<!-- Dashboard de Inventarios -->
<div class="stats">
    <div class="stat-card">
        <div class="stat-value" id="totalItems">-</div>
        <div class="stat-label">Total Items</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalValue">-</div>
        <div class="stat-label">Valor Total ($)</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalCategories">-</div>
        <div class="stat-label">Categorías</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="totalWarehouses">-</div>
        <div class="stat-label">Almacenes</div>
    </div>
</div>

<div class="charts-container">
    <div class="chart-box">
        <div id="inventoryChart" class="chart-container"></div>
    </div>
    
    <div class="chart-box">
        <div class="chart-header">
            <div class="chart-controls">
                <select id="groupSelector" class="form-select">
                    <option value="">Cargando grupos...</option>
                </select>
            </div>
        </div>
        <div id="categoriesChart" class="chart-container"></div>
    </div>
    
    <div class="chart-box full-width">
        <div id="warehousesChart" class="chart-container"></div>
    </div>
</div>
