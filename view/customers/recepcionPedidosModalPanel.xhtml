<rich:modalPanel width="480" height="380" resizeable="false"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:rich="http://richfaces.org/rich"
                 xmlns:h="http://java.sun.com/jsf/html"
                 xmlns:f="http://java.sun.com/jsf/core"
                 xmlns:a4j="http://richfaces.org/a4j"
                 xmlns:s="http://jboss.com/products/seam/taglib"
                 id="#{dialogId}">
    <f:facet name="header">Recepci&#243;n de Pedidos</f:facet>
    <f:facet name="controls">
        <h:graphicImage value="/img/close.png" style="cursor:pointer" id="closeRecepcionPanel"/>
        <rich:componentControl for="#{dialogId}"
                               attachTo="closeRecepcionPanel"
                               operation="hide" event="onclick"/>
    </f:facet>

    <script type="text/javascript">
        //<![CDATA[
        function clearTerritorioCheckboxes() {
            var inputs = document.getElementsByTagName('input');
            for (var i = 0; i < inputs.length; i++) {
                if (inputs[i].id && inputs[i].id.indexOf('territorioSelect') >= 0 && inputs[i].type === 'checkbox') {
                    inputs[i].checked = false;
                }
            }
        }
        //]]>
    </script>

    <h:form id="recepcionPedidosForm">
        <table cellpadding="4" cellspacing="0" style="width:100%;">
            <tr>
                <td style="width:110px; text-align:right; white-space:nowrap;"><h:outputText value="Fecha Entrega: *" style="font-weight:bold;"/></td>
                <td>
                    <rich:calendar id="fechaEntregaInput"
                                   value="#{recepcionPedidosReportAction.fechaEntrega}"
                                   datePattern="dd/MM/yyyy"
                                   inputClass="input"
                                   inputStyle="width:80px;"
                                   enableManualInput="false"
                                   popup="true"
                                   required="true"
                                   requiredMessage="La fecha de entrega es requerida">
                        <a4j:support event="onchanged"
                                     action="#{recepcionPedidosReportAction.onFechaChanged}"
                                     reRender="territorioContainer"
                                     ajaxSingle="true"
                                     onsubmit="clearTerritorioCheckboxes()"/>
                    </rich:calendar>
                </td>
            </tr>
            <tr>
                <td style="text-align:right; white-space:nowrap;"><h:outputText value="Almac&#233;n: *" style="font-weight:bold;"/></td>
                <td>
                    <h:selectOneMenu id="warehouseSelect"
                                     value="#{recepcionPedidosReportAction.warehouse}"
                                     style="width:310px;" required="true"
                                     requiredMessage="Seleccione un almac&#233;n">
                        <s:selectItems value="#{warehouseList}" var="wh"
                                       label="#{wh.name}"
                                       noSelectionLabel="-- Seleccione --"
                                       hideNoSelectionLabel="false"/>
                        <s:convertEntity/>
                        <a4j:support event="onchange"
                                     action="#{recepcionPedidosReportAction.onFechaChanged}"
                                     reRender="territorioContainer"
                                     ajaxSingle="true"
                                     onsubmit="clearTerritorioCheckboxes()"/>
                    </h:selectOneMenu>
                </td>
            </tr>
            <tr>
                <td style="text-align:right; vertical-align:top; padding-top:8px;"><h:outputText value="Territorio:" style="font-weight:bold;"/></td>
                <td>
                    <a4j:outputPanel id="territorioContainer" layout="block"
                                     style="height:200px; overflow-y:auto; border:1px solid #bbb; background:#fff; padding:4px;">
                        <h:panelGroup id="territorioContent">
                            <h:panelGroup rendered="#{recepcionPedidosReportAction.fechaEntrega == null}">
                                <h:outputText value="Seleccione una fecha para ver los territorios disponibles"
                                              style="color:#999; font-style:italic; font-size:11px;"/>
                            </h:panelGroup>
                            <h:panelGroup rendered="#{recepcionPedidosReportAction.fechaEntrega != null}">
                                <h:selectManyCheckbox id="territorioSelect"
                                                      value="#{recepcionPedidosReportAction.selectedTerritorios}"
                                                      layout="pageDirection">
                                    <s:selectItems value="#{recepcionPedidosReportAction.territoriosConPedidos}" var="terr"
                                                   label="#{terr.nombre}"/>
                                    <s:convertEntity/>
                                </h:selectManyCheckbox>
                            </h:panelGroup>
                        </h:panelGroup>
                    </a4j:outputPanel>
                    <h:outputText value="Sin selecci&#243;n = Todos los territorios"
                                  style="font-size:10px; color:#888;"/>
                </td>
            </tr>
        </table>
        <div class="buttons" style="text-align:center; margin-top:8px;">
            <h:commandButton id="generateRecepcionBtn"
                             action="#{recepcionPedidosReportAction.generateReport}"
                             value="Generar"
                             styleClass="button"/>
            <h:commandButton value="Cerrar" styleClass="button">
                <rich:componentControl for="#{dialogId}" event="onclick" disableDefault="true" operation="hide"/>
            </h:commandButton>
        </div>
    </h:form>
</rich:modalPanel>
