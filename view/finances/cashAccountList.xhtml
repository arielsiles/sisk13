<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['CashAccount.list']}</ui:define>
    <ui:param name="bodyWidth" value="100%"/>

    <ui:param name="selectedTab" value="finances"/>
    <ui:define name="body">
        <h:form id="cashAccountListSearch">

            <!-- Barra de filtros reusable (app-filterbar): una sola linea, placeholders estilo Odoo.
                 Se conservan todos los criterios: Codigo, Descripcion, Tipo y Cta. Movimiento. -->
            <div class="app-filterbar">
                <h:inputText id="accountCode" value="#{cashAccountDataModel.criteria.accountCode}" maxlength="20"
                             styleClass="app-filterbar__input app-filterbar__input--code app-ph-code" tabindex="1"/>

                <h:inputText id="description" value="#{cashAccountDataModel.criteria.description}" maxlength="100"
                             styleClass="app-filterbar__input app-ph-desc" tabindex="2"/>

                <h:selectOneMenu id="type"
                                 value="#{cashAccountDataModel.cashAccountType}"
                                 styleClass="app-filterbar__select"
                                 required="false"
                                 tabindex="3">
                    <s:selectItems value="#{cashAccountTypes}"
                                   var="element"
                                   label="#{messages[element.resourceKey]}"
                                   noSelectionLabel="#{messages['CashAccount.type']}"
                                   hideNoSelectionLabel="false"/>
                    <s:convertEnum/>
                </h:selectOneMenu>

                <label class="app-filterbar__check">
                    <h:selectBooleanCheckbox id="movement" value="#{cashAccountDataModel.movementAccount}"
                                             tabindex="4"/>
                    #{messages['CashAccount.movementShort']}
                </label>

                <a4j:commandLink action="#{cashAccountDataModel.search}"
                                 reRender="cashAccountList, dataScroller"
                                 styleClass="app-iconbtn"
                                 title="#{messages['Common.search']}"
                                 id="searchButtonId"
                                 tabindex="5">
                    <h:graphicImage value="/img/search-line.svg" alt="#{messages['Common.search']}"/>
                    <s:defaultAction/>
                </a4j:commandLink>
            </div>

            <!-- Placeholders (JSF 1.2 no propaga el atributo placeholder): se aplican por clase marcador.
                 El texto proviene de las claves i18n, no esta hardcodeado. -->
            <script type="text/javascript">
                (function () {
                    function ph(sel, t) {
                        var e = document.querySelector(sel);
                        if (e) { e.setAttribute("placeholder", t); }
                    }
                    ph(".app-ph-code", "#{messages['CashAccount.accountCode']}");
                    ph(".app-ph-desc", "#{messages['CashAccount.description']}");
                })();
            </script>

            <!-- Toolbar de acciones (app-toolbar): fila compacta a la derecha.
                 Orden: Analizar niveles, Exportar y Nuevo (Nuevo siempre el ultimo, extremo derecho). -->
            <div class="app-toolbar">
                <a4j:commandLink action="#{cashAccountLevelAnalysisAction.analyze}"
                                 styleClass="app-iconbtn"
                                 title="#{messages['CashAccount.levelAnalysis.analyze']}"
                                 id="analyzeLevelsButtonId"
                                 rendered="#{s:hasPermission('CASHACCOUNTLEVEL','VIEW')}"
                                 reRender="levelAnalysisData"
                                 oncomplete="Richfaces.showModalPanel('cashAccountLevelAnalysisModal')">
                    <h:graphicImage value="/img/levels-line.svg" alt="#{messages['CashAccount.levelAnalysis.analyze']}"/>
                </a4j:commandLink>

                <h:commandLink action="#{cashAccountReportAction.generateReport}"
                               styleClass="app-iconbtn app-iconbtn--excel"
                               title="#{messages['Common.export']}"
                               id="generateButtonId">
                    <h:graphicImage value="/img/excel-line.svg" alt="#{messages['Common.export']}"/>
                </h:commandLink>

                <s:button value="#{messages['Common.new']}"
                          view="/finances/cashAccount.xhtml"
                          styleClass="app-btn-primary"
                          propagation="begin"/>
            </div>

            <rich:dataTable value="#{cashAccountDataModel}" var="cashAccountItem" id="cashAccountList"
                            rows="#{sessionUser.rowsPerPage20}" width="100%" columnsWidth="10%, 10%, 50%, 5%, 10%, 10%, 5%">
                <f:facet name="header">
                    <rich:columnGroup>
                        <rich:column>#{messages['CashAccount.type']}</rich:column>
                        <rich:column>#{messages['CashAccount.accountCode']}</rich:column>
                        <rich:column>#{messages['CashAccount.description']}</rich:column>
                        <rich:column>#{messages['CashAccount.level']}</rich:column>
                        <rich:column>#{messages['CashAccount.activeAccount']}</rich:column>
                        <rich:column>#{messages['CashAccount.movement']}</rich:column>
                        <rich:column styleClass="center">#{messages['Common.select']}</rich:column>
                    </rich:columnGroup>
                </f:facet>
                <rich:column styleClass="center">
                    <h:outputText value="#{messages[cashAccountItem.accountType.resourceKey]}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:outputText value="#{cashAccountItem.accountCode}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{cashAccountItem.description}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:outputText value="#{cashAccountItem.accountLevel}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:outputText value="#{cashAccountItem.active ? 'SI' : 'NO'}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:outputText value="#{cashAccountItem.movementAccount ? 'SI' : 'NO'}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:commandLink value="#{messages['Common.select']}"
                                   immediate="true"
                                   action="#{cashAccountAction.select(cashAccountItem)}">
                        <s:conversationPropagation value="none"/>
                    </h:commandLink>
                </rich:column>

            </rich:dataTable>
            <app:dataScroller id="dataScroller" for="cashAccountList" dataModel="#{cashAccountDataModel}"/>


            <!--<div class="buttons">
                <s:button value="#{messages['Common.new']}" view="/finances/cashBox.xhtml" styleClass="button"
                          propagation="begin"/>
            </div>-->

        </h:form>

        <ui:include src="/finances/cashAccountLevelAnalysisModalPanel.xhtml"/>

    </ui:define>
</ui:composition>
