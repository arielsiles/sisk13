<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['CommercialCostCenter.list']}</ui:define>
    <ui:param name="bodyWidth" value="60%"/>
    <ui:param name="selectedTab" value="customers"/>
    <ui:define name="body">
        <h:form id="commercialCostCenterSearch">
            <rich:simpleTogglePanel label="#{messages['CommercialCostCenter.search']}" switchType="client">
                <s:decorate template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['CommercialCostCenter.code']}</ui:define>
                    <h:inputText id="code" value="#{commercialCostCenterDataModel.criteria.code}"
                                 maxlength="20" tabindex="1" styleClass="input"/>
                </s:decorate>
                <s:decorate template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['CommercialCostCenter.description']}</ui:define>
                    <h:inputText id="description" value="#{commercialCostCenterDataModel.criteria.description}"
                                 maxlength="150" tabindex="2" styleClass="input">
                    </h:inputText>
                    <a4j:commandButton action="#{commercialCostCenterDataModel.search}"
                                       reRender="commercialCostCenterList"
                                       styleClass="button" id="searchButtonId" tabindex="3"
                                       value="#{messages['Common.search']}">
                        <s:defaultAction/>
                    </a4j:commandButton>
                </s:decorate>
                <rich:jQuery selector="#code" query="focus()" timing="onload"/>
            </rich:simpleTogglePanel>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}"
                          view="/sales/commercialCostCenter.xhtml"
                          styleClass="button"
                          propagation="none"
                          rendered="#{s:hasPermission('COMMERCIALCOSTCENTER','CREATE')}"/>
            </div>

            <rich:dataTable value="#{commercialCostCenterDataModel}" var="commercialCostCenterItem"
                            id="commercialCostCenterList" rows="#{sessionUser.rowsPerPage}"
                            width="100%" columnsWidth="20%, 45%, 20%, 15%">
                <f:facet name="header">
                    <rich:columnGroup>
                        <rich:column>
                            <app:commandSortHeader sortProperty="commercialCostCenter.code"
                                                   dataModel="#{commercialCostCenterDataModel}"
                                                   reRender="commercialCostCenterList, dataScroller">
                                #{messages['CommercialCostCenter.code']}
                            </app:commandSortHeader>
                        </rich:column>
                        <rich:column>#{messages['CommercialCostCenter.description']}</rich:column>
                        <rich:column styleClass="center">#{messages['CommercialCostCenter.active']}</rich:column>
                        <rich:column styleClass="center">#{messages['Common.action']}</rich:column>
                    </rich:columnGroup>
                </f:facet>
                <rich:column>
                    <h:outputText value="#{commercialCostCenterItem.code}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{commercialCostCenterItem.description}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:graphicImage value="/img/check.png" rendered="#{commercialCostCenterItem.active}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:commandLink value="#{messages['Common.select']}"
                                   immediate="true"
                                   action="#{commercialCostCenterAction.select(commercialCostCenterItem)}"
                                   rendered="#{s:hasPermission('COMMERCIALCOSTCENTER','VIEW')}">
                        <s:conversationPropagation value="none"/>
                    </h:commandLink>
                </rich:column>
            </rich:dataTable>
            <app:dataScroller id="dataScroller" for="commercialCostCenterList" dataModel="#{commercialCostCenterDataModel}"/>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}"
                          view="/sales/commercialCostCenter.xhtml"
                          styleClass="button"
                          propagation="none"
                          rendered="#{s:hasPermission('COMMERCIALCOSTCENTER','CREATE')}"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
