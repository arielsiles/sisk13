<rich:modalPanel height="520" width="820" zindex="2000" resizeable="false" autosized="true"
                 xmlns="http://www.w3.org/1999/xhtml"
                 xmlns:rich="http://richfaces.org/rich"
                 xmlns:ui="http://java.sun.com/jsf/facelets"
                 xmlns:h="http://java.sun.com/jsf/html"
                 xmlns:f="http://java.sun.com/jsf/core"
                 xmlns:s="http://jboss.com/products/seam/taglib"
                 xmlns:a4j="http://richfaces.org/a4j"
                 xmlns:c="http://java.sun.com/jstl/core"
                 xmlns:app="http://encens.com/products/khipus/facelets"
                 id="#{dialogId}">

    <c:if test="#{empty dataModel}">
        <c:set var="dataModel" value="#{clientDataModel}"/>
    </c:if>

    <f:facet name="header">
        <h:outputText>#{messages['Client.list']}</h:outputText>
    </f:facet>
    <f:facet name="controls">
        <h:graphicImage value="/img/close.png" style="cursor:pointer" id="closeLink"/>
    </f:facet>
    <h:form id="salesClientListForm#{dialogId}">
        <rich:simpleTogglePanel label="#{messages['Client.search']}" switchType="client">
            <h:panelGrid columns="2" width="100%" cellpadding="0" cellspacing="0" border="0"
                         columnClasses="width50percent,width50percent">
                <s:decorate id="nameField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Client.name']}</ui:define>
                    <h:inputText id="name" value="#{dataModel.criteria.name}" maxlength="200"
                                 styleClass="input" tabindex="2001"/>
                </s:decorate>
                <s:decorate id="apField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Client.lastName']}</ui:define>
                    <h:inputText id="ap" value="#{dataModel.criteria.lastName}" maxlength="100"
                                 styleClass="input" tabindex="2002"/>
                </s:decorate>
                <s:decorate id="amField" template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['Client.maidenName']}</ui:define>
                    <h:inputText id="am" value="#{dataModel.criteria.maidenName}" maxlength="100"
                                 styleClass="input" tabindex="2003"/>
                </s:decorate>
                <s:decorate id="searchButtonField" template="/include/inputField.xhtml" styleClass="formRow">
                    <a4j:commandButton action="#{dataModel.search}"
                                       reRender="salesClientList, dataScroller"
                                       styleClass="button" value="#{messages['Common.search']}"
                                       id="searchButtonId" tabindex="2004">
                        <s:defaultAction/>
                    </a4j:commandButton>
                </s:decorate>
            </h:panelGrid>
        </rich:simpleTogglePanel>
        <br/>
        <rich:dataTable value="#{dataModel}" var="clientItem" id="salesClientList"
                        rows="#{sessionUser.rowsPerPage}" width="100%" columnsWidth="45%, 20%, 27%, 8%">
            <f:facet name="header">
                <rich:columnGroup>
                    <rich:column>
                        <app:commandSortHeader sortProperty="client.name"
                                               dataModel="#{dataModel}"
                                               reRender="salesClientList, dataScroller">
                            #{messages['SalesOrder.clientPicker.name']}
                        </app:commandSortHeader>
                    </rich:column>
                    <rich:column>#{messages['SalesOrder.clientPicker.code']}</rich:column>
                    <rich:column>#{messages['SalesOrder.clientPicker.identification']}</rich:column>
                    <rich:column styleClass="center">#{messages['Common.select']}</rich:column>
                </rich:columnGroup>
            </f:facet>
            <rich:column>
                <h:outputText value="#{clientItem.nombreCompleto}"/>
            </rich:column>
            <rich:column>
                <h:outputText value="#{clientItem.codigo}"/>
            </rich:column>
            <rich:column>
                <h:outputText value="#{clientItem.identificationDisplay}"/>
            </rich:column>
            <rich:column styleClass="center">
                <ui:insert name="assignButton"/>
                <rich:componentControl for="#{dialogId}" attachTo="assignButton" operation="hide" event="onclick"/>
            </rich:column>
        </rich:dataTable>
        <app:dataScroller id="dataScroller" for="salesClientList" dataModel="#{dataModel}"/>
        <rich:componentControl for="#{dialogId}" attachTo="closeLink" operation="hide" event="onclick"/>
    </h:form>
    <rich:jQuery selector="#name" query="focus()" timing="onload"/>
</rich:modalPanel>
