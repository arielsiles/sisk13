<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

    <ui:define name="pageTitle">#{messages['SalesOrderTerm.list']}</ui:define>
    <ui:param name="bodyWidth" value="60%"/>
    <ui:param name="selectedTab" value="customers"/>
    <ui:define name="body">
        <h:form id="salesOrderTermSearch">
            <rich:simpleTogglePanel label="#{messages['SalesOrderTerm.search']}" switchType="client">
                <s:decorate template="/include/inputField.xhtml" styleClass="formRow">
                    <ui:define name="label">#{messages['SalesOrderTerm.text']}</ui:define>
                    <h:inputText id="text" value="#{salesOrderTermDataModel.criteria.text}"
                                 maxlength="150" tabindex="1" styleClass="input">
                    </h:inputText>
                    <a4j:commandButton action="#{salesOrderTermDataModel.search}"
                                       reRender="salesOrderTermList"
                                       styleClass="button" id="searchButtonId" tabindex="2"
                                       value="#{messages['Common.search']}">
                        <s:defaultAction/>
                    </a4j:commandButton>
                </s:decorate>
                <rich:jQuery selector="#text" query="focus()" timing="onload"/>
            </rich:simpleTogglePanel>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}"
                          view="/sales/salesOrderTerm.xhtml"
                          styleClass="button"
                          propagation="none"
                          rendered="#{s:hasPermission('SALESORDERTERM','CREATE')}"/>
            </div>

            <rich:dataTable value="#{salesOrderTermDataModel}" var="salesOrderTermItem"
                            id="salesOrderTermList" rows="#{sessionUser.rowsPerPage}"
                            width="100%" columnsWidth="10%, 65%, 10%, 15%">
                <f:facet name="header">
                    <rich:columnGroup>
                        <rich:column styleClass="center">
                            <app:commandSortHeader sortProperty="salesOrderTerm.sortOrder"
                                                   dataModel="#{salesOrderTermDataModel}"
                                                   reRender="salesOrderTermList, dataScroller">
                                #{messages['SalesOrderTerm.sortOrder']}
                            </app:commandSortHeader>
                        </rich:column>
                        <rich:column>#{messages['SalesOrderTerm.text']}</rich:column>
                        <rich:column styleClass="center">#{messages['SalesOrderTerm.active']}</rich:column>
                        <rich:column styleClass="center">#{messages['Common.action']}</rich:column>
                    </rich:columnGroup>
                </f:facet>
                <rich:column styleClass="center">
                    <h:outputText value="#{salesOrderTermItem.sortOrder}"/>
                </rich:column>
                <rich:column>
                    <h:outputText value="#{salesOrderTermItem.shortText}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:graphicImage value="/img/check.png" rendered="#{salesOrderTermItem.active}"/>
                </rich:column>
                <rich:column styleClass="center">
                    <h:commandLink value="#{messages['Common.select']}"
                                   immediate="true"
                                   action="#{salesOrderTermAction.select(salesOrderTermItem)}"
                                   rendered="#{s:hasPermission('SALESORDERTERM','VIEW')}">
                        <s:conversationPropagation value="none"/>
                    </h:commandLink>
                </rich:column>
            </rich:dataTable>
            <app:dataScroller id="dataScroller" for="salesOrderTermList" dataModel="#{salesOrderTermDataModel}"/>

            <div class="buttons">
                <s:button value="#{messages['Common.new']}"
                          view="/sales/salesOrderTerm.xhtml"
                          styleClass="button"
                          propagation="none"
                          rendered="#{s:hasPermission('SALESORDERTERM','CREATE')}"/>
            </div>
        </h:form>
    </ui:define>
</ui:composition>
