<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:s="http://jboss.com/products/seam/taglib"
                xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:a4j="http://richfaces.org/a4j"
                xmlns:rich="http://richfaces.org/rich"
                xmlns:app="http://encens.com/products/khipus/facelets"
                template="/layout/template.xhtml">

<ui:define name="pageTitle">#{messages['Voucher.list']}</ui:define>
<ui:param name="bodyAlign" value="center"/>
<ui:param name="bodyWidth" value="97%"/>

<ui:param name="selectedTab" value="finances"/>
<ui:define name="body">
<h:form id="VoucherSearch">
<!-- Barra de filtros reusable (app-filterbar): una sola linea, placeholders estilo Odoo.
     Se conservan todos los filtros: Tipo de documento, N Doc, Glosa y rango de fechas.
     El boton Nuevo va en la misma linea, al extremo derecho. -->
<div class="app-filterbar">
    <h:selectOneMenu id="documType"
                     value="#{voucherAction.docType}"
                     styleClass="app-filterbar__select"
                     tabindex="1">
        <s:selectItems value="#{voucherDocumentTypeList}"
                       var="element"
                       label="#{element.fullName}"
                       noSelectionLabel="#{messages['WarehouseVoucher.documentType']}"
                       hideNoSelectionLabel="false"/>
        <s:convertEntity/>
    </h:selectOneMenu>

    <h:inputText id="documentNumber"
                 value="#{voucherAction.documentNumber}"
                 styleClass="app-filterbar__input app-filterbar__input--code app-ph-docnum"
                 maxlength="150"
                 tabindex="2"/>

    <h:inputText id="gloss"
                 value="#{voucherAction.gloss}"
                 styleClass="app-filterbar__input app-ph-gloss"
                 maxlength="150"
                 tabindex="3"/>

    <rich:calendar id="startDate"
                   value="#{voucherDataModel.startDate}"
                   inputClass="app-filterbar__input app-filterbar__input--date app-ph-start"
                   datePattern="#{messages['patterns.date']}"
                   enableManualInput="true"
                   tabindex="4">
        <f:convertDateTime pattern="#{messages['patterns.date']}"
                           timeZone="#{sessionUser.timeZone}"
                           type="date"/>
    </rich:calendar>

    <rich:calendar id="endDate"
                   value="#{voucherDataModel.endDate}"
                   inputClass="app-filterbar__input app-filterbar__input--date app-ph-end"
                   datePattern="#{messages['patterns.date']}"
                   enableManualInput="true"
                   tabindex="5">
        <f:convertDateTime pattern="#{messages['patterns.date']}"
                           timeZone="#{sessionUser.timeZone}"
                           type="date"/>
    </rich:calendar>

    <a4j:commandLink action="#{voucherAction.search}"
                     reRender="voucherList, dataScroller"
                     styleClass="app-iconbtn"
                     title="#{messages['Common.search']}"
                     id="searchButtonId"
                     tabindex="6">
        <h:graphicImage value="/img/search-line.svg" alt="#{messages['Common.search']}"/>
        <s:defaultAction/>
    </a4j:commandLink>

    <s:button value="#{messages['Common.new']}"
              view="/accounting/voucherCreate.xhtml"
              styleClass="app-btn-primary"
              rendered="#{s:hasPermission('VOUCHER','CREATE')}"
              propagation="begin"/>
</div>

<!-- Placeholders (JSF 1.2 no propaga el atributo placeholder): se aplican por clase
     marcador. El texto proviene de las claves i18n, no esta hardcodeado. -->
<script type="text/javascript">
    (function () {
        function ph(sel, t) {
            var e = document.querySelector(sel);
            if (e) { e.setAttribute("placeholder", t); }
        }
        ph(".app-ph-docnum", "#{messages['Voucher.documentNumber']}");
        ph(".app-ph-gloss", "#{messages['Voucher.gloss']}");
        ph(".app-ph-start", "#{messages['Common.start']}");
        ph(".app-ph-end", "#{messages['Common.end']}");
    })();
</script>

<!-- Separacion sutil (linea en blanco 5px) entre filtros y tabla, solo en esta vista. -->
<div style="height: 5px;"></div>

<rich:dataTable id="voucherList"
                value="#{voucherDataModel}"
                var="voucherItem"
                rows="#{voucherDataModel.pageSize}"
                width="100%"
                columnsWidth="8%, 5%, 5%, 5%, 69%, 8%">
    <f:facet name="header">
        <rich:columnGroup>
            <rich:column>
                <app:commandSortHeader sortProperty="voucher.date"
                                       dataModel="#{voucherDataModel}"
                                       reRender="voucherList, dataScroller">
                    #{messages['Voucher.date']}
                </app:commandSortHeader>
            </rich:column>
            <rich:column>
                <app:commandSortHeader sortProperty="voucher.documentType"
                                       dataModel="#{voucherDataModel}"
                                       reRender="voucherList, dataScroller">
                    #{messages['Common.type']}
                </app:commandSortHeader>
            </rich:column>
            <rich:column>
                <app:commandSortHeader sortProperty="voucher.transactionNumber"
                                       dataModel="#{voucherDataModel}"
                                       reRender="voucherList, dataScroller">
                    #{messages['Voucher.documentNumber']}
                </app:commandSortHeader>
            </rich:column>
            <rich:column>
                <app:commandSortHeader sortProperty="voucher.state"
                                       dataModel="#{voucherDataModel}"
                                       reRender="voucherList, dataScroller">
                    #{messages['Voucher.state']}
                </app:commandSortHeader>
            </rich:column>
            <rich:column>
                <app:commandSortHeader sortProperty="voucher.gloss"
                                       dataModel="#{voucherDataModel}"
                                       reRender="voucherList, dataScroller">
                    #{messages['Voucher.gloss']}
                </app:commandSortHeader>
            </rich:column>
            <rich:column styleClass="center">
                #{messages['Common.action']}
            </rich:column>
        </rich:columnGroup>
    </f:facet>
    <rich:column styleClass="center">
        <h:outputText value="#{voucherItem.date}">
            <f:convertDateTime pattern="#{messages['patterns.date']}"
                               timeZone="#{sessionUser.timeZone}"
                               type="date"/>
        </h:outputText>
    </rich:column>
    <rich:column styleClass="center">
        <h:outputText value="#{voucherItem.documentType}"/>
    </rich:column>
    <rich:column styleClass="center">
        <h:outputText value="#{voucherItem.documentNumber}"/>
    </rich:column>
    <rich:column styleClass="center">
        <h:outputText value="#{voucherItem.state}"/>
    </rich:column>
    <rich:column>
        <h:outputText value="#{voucherItem.gloss}"/>
    </rich:column>
    <rich:column styleClass="left">
        <!--<h:commandLink value="#{messages['Common.select']}" immediate="true" action="#{voucherUpdateAction.select(voucherItem)}">-->
        <h:commandLink action="#{voucherCreateAction.select(voucherItem)}" immediate="true">
            <h:graphicImage value="/img/edit-line.svg" styleClass="select-image" title="#{messages['Common.edit']}"/>
            <s:conversationPropagation value="none"/>
        </h:commandLink>
        &#160;
        <h:commandLink action="#{voucherCreateAction.generateReport(voucherItem)}"
                       immediate="true"
                       rendered="#{voucherItem.approved}">
            <h:graphicImage value="/img/pdf-line.svg" styleClass="select-image"
                            title="#{messages['Voucher.report.generateReport']}"/>
        </h:commandLink>
        &#160;
        <a4j:commandLink id="creditSaleCommandButton"
                         action="#{voucherCreateAction.initView(voucherItem)}"
                         styleClass="button"
                         immediate="true"
                         oncomplete="Richfaces.showModalPanel('voucherViewModalPanel');"
                         reRender="voucherViewModalPanel">
            <h:graphicImage value="/img/eye-line.svg" styleClass="select-image" title="#{messages['Voucher.viewDocument']}"/>
        </a4j:commandLink>
        &#160;
        <!--<h:graphicImage value="/img/user3c.png" styleClass="select-image" title="#{voucherItem.userAudit()}" rendered="#{voucherItem.createdBy != null}"/>-->

        <h:graphicImage value="#{voucherItem.updatedBy != null ? '/img/user3u.png' : '/img/user3c.png'}"
                        styleClass="select-image"
                        title="#{voucherItem.userAudit()}"
                        rendered="#{voucherItem.createdBy != null}"/>


    </rich:column>
</rich:dataTable>
<app:dataScroller id="dataScroller" for="voucherList" dataModel="#{voucherDataModel}" showPageSize="true"/>

</h:form>

    <s:decorate id="voucherViewModalPanelContainer" template="/accounting/voucherViewModalPanel.xhtml">
        <ui:param name="containerId" value="voucherViewModalPanelContainer"/>
        <ui:param name="dialogId" value="voucherViewModalPanel"/>
    </s:decorate>

</ui:define>

</ui:composition>
