# Cliente: ILVA
# Construir con: ant -f build-prod.xml -Dclient=ilva dist-release

# Schema MySQL de PRODUCCION del cliente (se inyecta en las 4 constantes *_SCHEMA al compilar)
dbSchema=khipus

# Subcarpeta del cliente dentro de release.dir (D:/appserver/release/<clientReleaseName>/v<version>)
clientReleaseName=ILVA

# Compania que aparece pre-llenada en el login (solo la compania; usuario/contrasena nunca)
clientCompanyLogin=ILVA
